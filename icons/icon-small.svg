<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 16 / 32 px toolbar art: the same play button and puzzle piece as icon.svg, filling more of the square, with a
       wider gap. The piece gets a second knob on the right: with only the top knob it reads as a padlock when tiny. -->
  <defs>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6A33"/>
      <stop offset="1" stop-color="#FC4C1B"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF961F"/>
      <stop offset="1" stop-color="#FF7E14"/>
    </linearGradient>
    <mask id="gap">
      <rect width="128" height="128" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round">
        <rect x="66" y="74" width="46" height="46" rx="7"/>
        <circle cx="89" cy="63" r="11"/>
        <circle cx="116" cy="97" r="9.5"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#gap)">
    <rect x="2" y="10" width="116" height="94" rx="28" fill="url(#play)"/>
    <path d="M34 36 L34 74 L64 55 Z" fill="#fff" stroke="#fff" stroke-width="11" stroke-linejoin="round"/>
  </g>

  <g fill="url(#piece)">
    <rect x="66" y="74" width="46" height="46" rx="7"/>
    <circle cx="89" cy="63" r="11"/>
    <rect x="83" y="63" width="12" height="12"/>
    <circle cx="116" cy="97" r="9.5"/>
    <rect x="110" y="91" width="7" height="12"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 16 / 32 px toolbar art: same screen and 中 as icon.svg, without the subtitle lines and with heavier strokes,
       so the character stays legible at a few pixels. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="115">
      <stop offset="0" stop-color="#FF9440"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
  <g fill="none" stroke="url(#ink)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="42" width="76" height="42" rx="9"/>
    <path d="M64 21V107"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- HackerTube 中文助手: a dark screen showing 中 above two subtitle lines (Chinese + English).
       Used for the 48 and 128 px icons; icon-small.svg is the simplified art for 16 and 32 px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303030"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- user-space units: a bounding-box gradient would vanish on the zero-width vertical stroke -->
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="89">
      <stop offset="0" stop-color="#FF9440"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g fill="none" stroke="url(#ink)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <rect x="27" y="38" width="74" height="32" rx="9"/>
    <path d="M64 19V82"/>
  </g>
  <rect x="30" y="96" width="68" height="9" rx="4.5" fill="#fff"/>
  <rect x="44" y="110" width="40" height="6" rx="3" fill="#fff" fill-opacity=".45"/>
</svg>
